# Vitis Linker Configuration for Subgraph Isomorphism Kernel

[connectivity]
# Map kernel memory ports to FPGA physical memory channels
# Format: sp=<compute_unit_name>.<port_name>:<memory_bank>

sp=preprocess_kernel_1.edge_buf:HBM[0]
sp=preprocess_kernel_1.htb_output:HBM[1]
sp=preprocess_kernel_1.bloom_p:HBM[2]
sp=preprocess_kernel_1.qVertices_out:HBM[8]
sp=preprocess_kernel_1.hTables0_out:HBM[9]
sp=preprocess_kernel_1.hTables1_out:HBM[10]

sp=scatter_kernel_1.htb_input:HBM[1]
sp=scatter_kernel_1.htb_output0:HBM[4]
sp=scatter_kernel_1.htb_output1:HBM[5]
sp=scatter_kernel_1.htb_output2:HBM[6]
sp=scatter_kernel_1.htb_output3:HBM[7]

sp=multiwayJoin_kernel_1.htb_buf0:HBM[4]
sp=multiwayJoin_kernel_1.htb_buf1:HBM[5]
sp=multiwayJoin_kernel_1.htb_buf2:HBM[6]
sp=multiwayJoin_kernel_1.htb_buf3:HBM[7]
sp=multiwayJoin_kernel_1.bloom_p:HBM[2]
sp=multiwayJoin_kernel_1.res_buf:HBM[0]
sp=multiwayJoin_kernel_1.qVertices_in:HBM[8]
sp=multiwayJoin_kernel_1.hTables0_in:HBM[9]
sp=multiwayJoin_kernel_1.hTables1_in:HBM[10]

[hls]
pre_tcl=hls_config.tcl

[vivado]
# Set maximum number of threads for Vivado synthesis and implementation.
param=general.maxThreads=16
prop=run.impl_1.strategy=Performance_ExplorePostRoutePhysOpt